<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mantra Pro - Fixed</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .card { background: #161616; padding: 20px; border-radius: 20px; border: 1px solid #333; max-width: 450px; margin: auto; }
        select, button { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; font-size: 16px; outline: none; }
        select { background: #222; color: white; border: 1px solid #555; }
        button { font-weight: bold; cursor: pointer; border: none; }
        #start-btn { background: #007bff; color: white; }
        #counter { font-size: 100px; font-weight: bold; color: #00ff88; margin: 20px 0; line-height: 1; }
        #status-box { background: #000; padding: 15px; color: #aaa; border-radius: 8px; font-size: 14px; min-height: 20px; border: 1px solid #333; margin-top: 10px; }
        .label { text-align: left; font-size: 11px; color: #555; margin-bottom: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: #888; font-size: 16px; margin-bottom: 20px;">MANTRA COUNTER</h2>
    
    <div class="label">Choose Mantra:</div>
    <select id="mantra-select"></select>

    <div class="label">Chant Goal:</div>
    <select id="target-select">
        <option value="11">11 Times</option>
        <option value="33">33 Times</option>
        <option value="108" selected>108 Times</option>
    </select>

    <div id="counter">0</div>

    <button id="start-btn">START LISTENING</button>

    <div id="status-box">System Loading...</div>
</div>

<script>
    // 1. CATCH ALL ERRORS (If the phone blocks something, we will see it here)
    window.onerror = function(message, source, lineno) {
        document.getElementById('status-box').innerText = "CRASH ERROR: " + message + " (Line " + lineno + ")";
        return true; 
    };

    // 2. Only the requested Mantras
    const mantras = [
        "4 Mukhi | Om Hrim Namah",
        "5 Mukhi | Om Hrim Namah",
        "6 Mukhi | Om Hrim Hoom Namah",
        "9 Mukhi | Om Hrim Hum Namah"
    ];

    // 3. UI Elements
    const selectBox = document.getElementById('mantra-select');
    const startBtn = document.getElementById('start-btn');
    const counterText = document.getElementById('counter');
    const statusBox = document.getElementById('status-box');
    
    let count = 0;
    let isRunning = false;
    let recognition = null;
    let audioCtx = null;

    // 4. Populate Dropdown IMMEDIATELY (No waiting for page loads)
    try {
        mantras.forEach(function(m) {
            const opt = document.createElement('option');
            opt.value = m.toLowerCase();
            opt.innerText = m;
            selectBox.appendChild(opt);
        });
        statusBox.innerText = "System Ready. Tap Start.";
    } catch(err) {
        statusBox.innerText = "Failed to load list: " + err.message;
    }

    // 5. Setup Microphone & AI
    try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'hi-IN'; // Sanskrit/Hindi sounds

            recognition.onresult = function(event) {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const word = event.results[i][0].transcript.toLowerCase();
                        checkMatch(word);
                    }
                }
            };

            recognition.onend = function() {
                if (isRunning) recognition.start();
            };

            recognition.onerror = function(event) {
                statusBox.innerText = "Mic Issue: " + event.error;
            };
        } else {
            statusBox.innerText = "Error: Browser does not support Voice Recognition.";
        }
    } catch(err) {
        statusBox.innerText = "Speech Engine Error: " + err.message;
    }

    // 6. Logic
    function checkMatch(text) {
        statusBox.innerText = "Heard: " + text;
        const targetPhrase = selectBox.value;
        
        // Clean up AI mistakes
        const cleanText = text.replace(/cream|clean/g, "klim")
                              .replace(/green|dream|rim/g, "hrim")
                              .replace(/home|room|whom/g, "hum");

        // Check if the specific sound is heard
        if (cleanText.includes(targetPhrase) || cleanText.includes("hrim")) {
            count++;
            counterText.innerText = count;
            playBeep();
            
            const goal = parseInt(document.getElementById('target-select').value);
            if (count >= goal) {
                stopApp();
                statusBox.innerText = "GOAL COMPLETED!";
            }
        }
    }

    // 7. Beep Sound
    function playBeep() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 600;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    // 8. Start & Stop Button Logic
    startBtn.onclick = async function() {
        if (!isRunning) {
            try {
                // Initialize Audio Context on click
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Force Mic Permission
                await navigator.mediaDevices.getUserMedia({ audio: true });
                
                count = 0;
                counterText.innerText = "0";
                isRunning = true;
                
                if (recognition) {
                    recognition.start();
                    startBtn.innerText = "STOP LISTENING";
                    startBtn.style.background = "#ff4444";
                    statusBox.innerText = "Listening...";
                }
            } catch(err) {
                statusBox.innerText = "Permission Denied. Please allow Microphone.";
            }
        } else {
            stopApp();
        }
    };

    function stopApp() {
        isRunning = false;
        if(recognition) recognition.stop();
        startBtn.innerText = "START LISTENING";
        startBtn.style.background = "#007bff";
    }
</script>
</body>
</html>
