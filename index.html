<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mantra Pro</title>
    <style>
        :root { --neon: #00ff88; --bg: #0a0a0a; --card: #161616; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; text-align: center; margin: 0; padding: 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid #333; max-width: 450px; margin: 20px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { font-size: 16px; letter-spacing: 2px; color: #888; text-transform: uppercase; margin-bottom: 20px; }
        select { width: 100%; padding: 15px; background: #222; color: #fff; border: 1px solid #444; border-radius: 12px; font-size: 16px; margin-bottom: 15px; display: block; outline: none; }
        #counter { font-size: 120px; font-weight: bold; color: var(--neon); margin: 20px 0; line-height: 1; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        #start-btn { background: #007bff; color: white; }
        #start-btn.active { background: #ff3b30; }
        #manual-btn { background: #333; color: var(--neon); flex: 0 0 60px; font-size: 24px; }
        .status-box { background: #000; padding: 12px; border-radius: 10px; font-size: 12px; color: #666; min-height: 20px; border: 1px solid #222; margin-top: 15px; }
        .label { text-align: left; font-size: 11px; color: #555; margin: 10px 0 5px 5px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="card">
    <h2>Mantra Counter</h2>
    
    <div class="label">Choose Mantra:</div>
    <select id="mantra-select">
        <option value="">-- Select Mantra --</option>
    </select>

    <div class="label">Goal:</div>
    <select id="target-select">
        <option value="11">11 Times</option>
        <option value="33">33 Times</option>
        <option value="108" selected>108 Times</option>
    </select>

    <div id="counter">0</div>

    <div class="btn-group">
        <button id="start-btn">START LISTENING</button>
        <button id="manual-btn">+</button>
    </div>

    <div class="status-box" id="status-text">System Ready</div>
</div>

<script>
    // Database of all mantras from your images
    const mantraList = [
        "1 Mukhi | Om Hrim Namah",
        "2 Mukhi | Om Namah",
        "3 Mukhi | Om Klim Namah",
        "4 Mukhi | Om Hrim Namah",
        "5 Mukhi | Om Hrim Namah",
        "6 Mukhi | Om Hrim Hoom Namah",
        "7 Mukhi | Om Hum Namah",
        "8 Mukhi | Om Hum Namah",
        "9 Mukhi | Om Hrim Hum Namah",
        "10 Mukhi | Om Hrim Namah",
        "11 Mukhi | Om Hrim Hum Namah",
        "12 Mukhi | Om Krom Srom Rom Namah",
        "13 Mukhi | Om Hrim Namah",
        "14 Mukhi | Om Namah",
        "15 Mukhi | Om Hrim Namah",
        "16 Mukhi | Om Hrim Hum Namah",
        "17 Mukhi | Om Hrim Hum Hum Namah",
        "18 Mukhi | Om Hrim Hum Ekatva Rupe Hum Hrim Om",
        "19 Mukhi | Om Namoh Bhagwate Vashu Devaya Namah",
        "20 Mukhi | Om Hrim Hrim Hum Hum Brahmane Namah",
        "21 Mukhi | Om Hreem Hoom Shivaya Namah",
        "22 Mukhi | Om Hreem Hum Namah",
        "23 Mukhi | Om Namo Bhagwatey Vishnu Devaya Namah",
        "24 Mukhi | Om Krom Shrom Rom Namah",
        "25 Mukhi | Om Hreem Shreem Vam Tripura Sundari Devyai Namah",
        "Gaurishankar | Om Gauri Shankaray Namaha"
    ];

    let count = 0;
    let isListening = false;
    let recognition;
    let audioCtx;

    // Elements
    const mantraSelect = document.getElementById('mantra-select');
    const startBtn = document.getElementById('start-btn');
    const manualBtn = document.getElementById('manual-btn');
    const counterDisplay = document.getElementById('counter');
    const statusText = document.getElementById('status-text');

    // Run when page is ready
    window.onload = function() {
        // Populate Dropdown
        mantraList.forEach((m) => {
            let opt = document.createElement('option');
            opt.value = m.toLowerCase();
            opt.innerText = m;
            mantraSelect.appendChild(opt);
        });

        setupSpeech();
    };

    function setupSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.innerText = "Error: Browser doesn't support Voice.";
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'hi-IN'; // Better for Sanskrit Beej sounds

        recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    const text = event.results[i][0].transcript.toLowerCase();
                    processResult(text);
                }
            }
        };

        recognition.onend = () => { if (isListening) recognition.start(); };
        recognition.onerror = (e) => { statusText.innerText = "Listening..."; };
    }

    function processResult(heardText) {
        statusText.innerText = "Heard: " + heardText;
        const selectedMantra = mantraSelect.value;
        if (!selectedMantra) return;

        // Phonetic fix for common AI errors
        const cleanHeard = heardText.replace(/cream|claim/g, "klim").replace(/green|dream/g, "hrim").replace(/home|room/g, "hum");

        // Logic: if the phrase is long, look for keywords. If short, look for the whole phrase.
        if (cleanHeard.includes(selectedMantra) || (selectedMantra.length > 15 && cleanHeard.length > 3)) {
            doIncrement();
        }
    }

    function doIncrement() {
        count++;
        counterDisplay.innerText = count;
        const goal = parseInt(document.getElementById('target-select').value);
        
        if (count >= goal) {
            beep(880, 1);
            stopListening();
            statusText.innerText = "GOAL REACHED!";
        } else if (count % 11 === 0) {
            beep(440, 0.2);
        }
    }

    async function startListening() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
            count = 0;
            counterDisplay.innerText = "0";
            isListening = true;
            recognition.start();
            startBtn.innerText = "STOP";
            startBtn.classList.add('active');
            statusText.innerText = "Listening...";
        } catch (e) {
            alert("Microphone permission required.");
        }
    }

    function stopListening() {
        isListening = false;
        if(recognition) recognition.stop();
        startBtn.innerText = "START LISTENING";
        startBtn.classList.remove('active');
    }

    startBtn.onclick = () => {
        if (!isListening) startListening();
        else stopListening();
    };

    manualBtn.onclick = () => {
        if (!audioCtx) audioCtx = new AudioContext();
        doIncrement();
    };

    function beep(freq, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.start();
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    }
</script>
</body>
</html>
