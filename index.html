<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mantra Pro - Meditation Mode</title>

<style>
body {
    font-family: sans-serif;
    background: #0a0a0a;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 20px;
}

.card {
    background: #161616;
    padding: 20px;
    border-radius: 20px;
    border: 1px solid #333;
    max-width: 450px;
    margin: auto;
}

select, button {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
    font-size: 16px;
}

select {
    background: #222;
    color: white;
    border: 1px solid #555;
}

button {
    font-weight: bold;
    cursor: pointer;
    border: none;
}

#start-btn { background: #007bff; color: white; }
#tap-btn { background: #00aa88; color: white; }

#counter {
    font-size: 90px;
    font-weight: bold;
    color: #00ff88;
    margin: 20px 0;
}

#status-box {
    background: #000;
    padding: 10px;
    color: #aaa;
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid #333;
}
</style>
</head>

<body>

<div class="card">
<h2 style="color:#888;">🧘 MANTRA COUNTER</h2>

<select id="mantra-select"></select>

<select id="target-select">
<option value="11">11</option>
<option value="33">33</option>
<option value="108" selected>108</option>
</select>

<div id="counter">0</div>

<button id="start-btn">START</button>
<button id="tap-btn">TAP (MALA BEAD)</button>

<div id="status-box">Ready</div>
</div>

<script>
window.onerror = function(msg, src, line) {
    document.getElementById('status-box').innerText = "Error: " + msg;
};

// -------------------- MANTRAS --------------------
const mantras = [
    "Om Hrim Namah",
    "Om Hrim Hoom Namah",
    "Om Hrim Hum Namah"
];

// -------------------- UI --------------------
const selectBox = document.getElementById('mantra-select');
const startBtn = document.getElementById('start-btn');
const tapBtn = document.getElementById('tap-btn');
const counterText = document.getElementById('counter');
const statusBox = document.getElementById('status-box');

let count = 0;
let isRunning = false;
let recognition = null;
let audioCtx = null;

// Populate dropdown
mantras.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m.toLowerCase();
    opt.innerText = m;
    selectBox.appendChild(opt);
});

// -------------------- SPEECH SETUP --------------------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'hi-IN';

    recognition.onresult = function(event) {
        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
                let text = event.results[i][0].transcript.toLowerCase();
                checkMatch(text);
            }
        }
    };

    recognition.onend = function() {
        if (isRunning) {
            setTimeout(() => {
                try { recognition.start(); } catch(e){}
            }, 500);
        }
    };

    recognition.onerror = function(e) {
        statusBox.innerText = "Mic: " + e.error;
    };

} else {
    statusBox.innerText = "Voice not supported. Use Chrome Android.";
    startBtn.disabled = true;
}

// -------------------- MATCH LOGIC --------------------
function checkMatch(text) {
    statusBox.innerText = "Heard: " + text;

    const clean = text
        .replace(/green|dream|rim/g, "hrim")
        .replace(/home|room|whom/g, "hum");

    const keywords = ["om","hrim","hum","namah"];
    let matchCount = keywords.filter(k => clean.includes(k)).length;

    if (matchCount >= 2) triggerCount();
}

// -------------------- CORE COUNT --------------------
function triggerCount() {
    count++;
    counterText.innerText = count;

    playBeep();
    vibrate();

    let goal = parseInt(document.getElementById('target-select').value);
    if (count >= goal) {
        stopApp();
        statusBox.innerText = "🟢 COMPLETED";
        vibrate(300);
    }
}

// -------------------- SOUND --------------------
function playBeep() {
    if (!audioCtx) return;

    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 600;
        osc.start();

        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
        osc.stop(audioCtx.currentTime + 0.1);
    } catch(e){}
}

// -------------------- VIBRATION --------------------
function vibrate(duration = 50) {
    if (navigator.vibrate) {
        navigator.vibrate(duration);
    }
}

// -------------------- BUTTONS --------------------
startBtn.onclick = async function() {
    if (!isRunning) {
        try {
            if (!audioCtx)
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            if (audioCtx.state === 'suspended')
                await audioCtx.resume();

            await navigator.mediaDevices.getUserMedia({ audio: true });

            count = 0;
            counterText.innerText = "0";
            isRunning = true;

            if (recognition) recognition.start();

            startBtn.innerText = "STOP";
            startBtn.style.background = "#ff4444";
            statusBox.innerText = "Listening...";

        } catch(e) {
            statusBox.innerText = "Mic permission denied";
        }

    } else {
        stopApp();
    }
};

// Manual mala tap
tapBtn.onclick = function() {
    if (!isRunning) return;
    triggerCount();
};

// Stop
function stopApp() {
    isRunning = false;
    if (recognition) recognition.stop();

    startBtn.innerText = "START";
    startBtn.style.background = "#007bff";
}
</script>

</body>
</html>
