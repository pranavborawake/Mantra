<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mantra Counter Pro</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 20px; max-width: 400px; margin: auto; border: 1px solid #333; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; background: #333; color: white; font-size: 18px; box-sizing: border-box; }
        #counter { font-size: 100px; margin: 20px 0; color: #00ff88; font-weight: bold; }
        button { width: 100%; padding: 20px; font-size: 20px; font-weight: bold; border-radius: 15px; border: none; color: white; cursor: pointer; }
        .start-btn { background: #007bff; }
        .stop-btn { background: #ff4444; }
        .log { margin-top: 20px; font-size: 14px; color: #888; background: #222; padding: 10px; border-radius: 8px; min-height: 20px; }
        label { display: block; text-align: left; margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin:0 0 10px 0;">Mantra Counter</h2>
    
    <label>Mantra Word:</label>
    <input type="text" id="mantra-input" value="om" placeholder="e.g. om">

    <label>Target Count:</label>
    <select id="target-select">
        <option value="11">11 Times</option>
        <option value="33">33 Times</option>
        <option value="108" selected>108 Times</option>
    </select>

    <label>Completion Sound:</label>
    <select id="sound-select">
        <option value="beep">Electronic Beep</option>
        <option value="ding">Zen Bell (Ding)</option>
        <option value="none">No Sound</option>
    </select>

    <div id="counter">0</div>

    <button id="action-btn" class="start-btn">START CHANTING</button>
    <div class="log" id="log-box">Ready...</div>
</div>

<script>
    let count = 0;
    let isRunning = false;
    let recognition;
    let audioCtx;

    const actionBtn = document.getElementById('action-btn');
    const counterDisplay = document.getElementById('counter');
    const logBox = document.getElementById('log-box');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        // recognition.lang = 'sa-IN'; // Uncomment this line for better Sanskrit/Hindi recognition

        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
            const targetWord = document.getElementById('mantra-input').value.trim().toLowerCase();
            const targetTotal = parseInt(document.getElementById('target-select').value);
            
            logBox.innerText = "Heard: " + transcript;

            // FIX: This counts HOW MANY TIMES the word appears in the current sentence
            const words = transcript.split(/\s+/);
            const matches = words.filter(word => word.includes(targetWord)).length;

            if (matches > 0) {
                count += matches;
                counterDisplay.innerText = count;

                if (count >= targetTotal) {
                    playCompletionSound();
                    stopApp();
                }
            }
        };

        recognition.onerror = (e) => { logBox.innerText = "Error: " + e.error; };
        recognition.onend = () => { if (isRunning) recognition.start(); };
    }

    async function startApp() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            await navigator.mediaDevices.getUserMedia({ audio: true });
            
            count = 0;
            counterDisplay.innerText = count;
            isRunning = true;
            recognition.start();
            
            actionBtn.innerText = "STOP CHANTING";
            actionBtn.className = "stop-btn";
            logBox.innerText = "Listening...";
        } catch (err) {
            alert("Microphone access denied. Ensure you are using HTTPS.");
        }
    }

    function stopApp() {
        isRunning = false;
        recognition.stop();
        actionBtn.innerText = "START CHANTING";
        actionBtn.className = "start-btn";
    }

    actionBtn.onclick = () => {
        if (!isRunning) startApp();
        else stopApp();
    };

    function playCompletionSound() {
        const soundType = document.getElementById('sound-select').value;
        if (soundType === 'none') return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (soundType === 'beep') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (soundType === 'ding') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);
            osc.start();
            osc.stop(audioCtx.currentTime + 2);
        }
    }
</script>
</body>
</html>
